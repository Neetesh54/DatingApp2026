<div class="flex justify-center gap-3 pt-10">
    <button class="btn btn-accent" (click)="get404Error()"> Test 404 Error</button>
    <button class="btn btn-warning" (click)="get400Error()"> Test 400 Error</button>
    <button class="btn btn-primary" (click)="get401Error()"> Test 401 Error</button>
    <button class="btn btn-secondary" (click)="get500Error()"> Test 500 Error</button>
    <button class="btn btn-info" (click)="get400ValidationError()"> Test 400 Validation Error</button>
</div>

@if(validationErros().length>0)
{
<div class="card bg-base-100 flex mt-5 rounded-2xl  w-1/2 p-3 mx-auto">
    <ul class="flex flex-col text-red-600 spce-y-2">
        @for (error of validationErros(); track $index) {
        <li>{{error}}</li>
        }
    </ul>
</div>
}
